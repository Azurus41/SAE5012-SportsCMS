server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Éco-conception : compression et cache long des fichiers versionnés par Vite.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers déposés (CSV, images) servis par nginx.
    location /uploads/ {
        alias /var/www/uploads/;
    }

    # API Symfony (profil « back »). La résolution est différée : nginx démarre même sans le conteneur php.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $php_upstream php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_pass $php_upstream;
    }

    # Application React (routes gérées côté client).
    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
