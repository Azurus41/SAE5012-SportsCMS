# Touchline — environnement Docker (SAÉ 501.2, partie R508).
#   docker compose up -d --build                 -> front (nginx) + MySQL + phpMyAdmin
#   docker compose --profile back up -d --build  -> + PHP-FPM pour le back Symfony (dossier backend/ à créer)
# Copier .env.example en .env avant le premier lancement.

services:
  web:
    build:
      context: ./frontend
      dockerfile: ../docker/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: ${HUB_NAMESPACE:-touchline}/touchline-web:${TAG:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - db
    restart: unless-stopped

  php:
    profiles: ["back"]
    build:
      context: ./docker/php
    image: ${HUB_NAMESPACE:-touchline}/touchline-php:${TAG:-latest}
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4"
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
    volumes:
      - ./backend:/var/www/backend
      - uploads:/var/www/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 20M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
  uploads:
